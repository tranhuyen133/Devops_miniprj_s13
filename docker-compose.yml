services:
  mysql:
    image: mysql:8.0
    container_name: campus-hub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: campus_hub
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - campus-net

  backend:
    build:
      context: ./backend
    image: campus-hub-backend
    container_name: campus-hub-backend
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/campus_hub?createDatabaseIfNotExist=true"
      DB_USERNAME: root
      DB_PASSWORD: "123456"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - campus-net

volumes:
  mysql_data:

networks:
  campus-net:
